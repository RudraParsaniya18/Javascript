<!DOCTYPE html>
<html>
<head>
    <title>Hollow Square Pattern</title>
</head>
<body>

<script>
    let rows = Number(prompt("Enter the number of rows:"));

    for (let i = 1; i <= rows; i++) {
        let pattern = " ";

        for (let j = 1; j <= rows; j++) {
            if (i === 1 || i === rows || j === 1 || j === rows) {
                pattern += "* ";
            } else {
                pattern += "  ";
            }
        }

        console.log(pattern);
    }
</script>

</body>
</html>
