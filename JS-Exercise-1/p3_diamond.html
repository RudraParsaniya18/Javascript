```html
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hollow Diamond Pattern</title>
</head>
<body>

    <h1>Hollow Diamond Pattern</h1>

    <script>
        let rows = Number(prompt("Enter the number of rows:"));

        for (let i = 1; i <= rows; i++) {

            let pattern = "";

            for (let j = 1; j <= rows - i; j++) {
                pattern += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {

                if (j === 1 || j === (2 * i - 1)) {
                    pattern += "*";
                } else {
                    pattern += " ";
                }
            }

            console.log(pattern);
        }

        for (let i = rows - 1; i >= 1; i--) {

            let pattern = "";

            for (let j = 1; j <= rows - i; j++) {
                pattern += " ";
            }

            for (let j = 1; j <= (2 * i - 1); j++) {

                if (j === 1 || j === (2 * i - 1)) {
                    pattern += "*";
                } else {
                    pattern += " ";
                }
            }

            console.log(pattern);
        }
    </script>

</body>
</html>
