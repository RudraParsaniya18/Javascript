<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sort Array of Objects</title>
</head>
<body>

    <h1>Sort Array of Objects</h1>

    <script>

        let people = [
            { id: 1, name: "Rahul", age: 25 },
            { id: 2, name: "Amit", age: 22 },
            { id: 3, name: "Jay", age: 25 },
            { id: 4, name: "Priya", age: 20 },
            { id: 5, name: "Riya", age: 22 },
            { id: 6, name: "Karan", age: 28 },
            { id: 7, name: "Neha", age: 24 },
            { id: 8, name: "Vivek", age: 28 },
            { id: 9, name: "Ankit", age: 20 },
            { id: 10, name: "Sneha", age: 24 }
        ];


        function sortPeople(array) {

            array.sort(function(a, b) {

                if (a.age !== b.age) {
                    return a.age - b.age;
                }
                return b.name.localeCompare(a.name);

            });

            return array;
        }


        let sortedPeople = sortPeople(people);

        console.log(sortedPeople);

    </script>

</body>
</html>
