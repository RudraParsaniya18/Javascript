<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Month Name</title>
</head>
<body>

    <h1>Get Month Name</h1>

    <script>

        let input = prompt("Enter date (DD/MM/YYYY):");

        let parts = input.split("/");

        let month = Number(parts[1]);

        let months = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];

        console.log("Month =", months[month - 1]);

    </script>

</body>
</html>
