<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unix Timestamp</title>
</head>
<body>

    <h1>Unix Timestamp Converter</h1>

    <script>

        let input = prompt("Enter Unix timestamp:");

        let timestamp = Number(input);
        let date = new Date(timestamp * 1000);

        let days = [
            "Sunday",
            "Monday",
            "Tuesday",
            "Wednesday",
            "Thursday",
            "Friday",
            "Saturday"
        ];

        let months = [
            "January",
            "February",
            "March",
            "April",
            "May",
            "June",
            "July",
            "August",
            "September",
            "October",
            "November",
            "December"
        ];

        let dayName = days[date.getDay()];
        let monthName = months[date.getMonth()];

        let day = date.getDate();
        let year = date.getFullYear();

        let hours = date.getHours();
        let minutes = date.getMinutes();
        let seconds = date.getSeconds();

        let ampm = hours >= 12 ? "PM" : "AM";

        hours = hours % 12;

        if (hours === 0) {
            hours = 12;
        }

        if (minutes < 10) {
            minutes = "0" + minutes;
        }

        if (seconds < 10) {
            seconds = "0" + seconds;
        }

        console.log(
            dayName + ", " +
            monthName + " " +
            day + ", " +
            year + " " +
            hours + ":" +
            minutes + ":" +
            seconds + " " +
            ampm
        );

    </script>

</body>
</html>
