
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock and Stopwatch</title>

    <!-- Bootstrap CSS -->
    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container py-5">
        <div class="clock-card mx-auto">

            <h2 class="text-center  mb-4 ">Digital Clock</h2>

            <div id="currentTime" class="digital-display">
                00:00:00
            </div>

            <div id="currentDate" class="text-center date-display">
                01-Jan-2026
            </div>

            <hr class="my-4">

            <h2 class="text-center mb-4">Stopwatch</h2>

            <div id="stopwatch" class="digital-display">
                00:00:00:00
            </div>

            <div class="buttons text-center mt-4">
                <button id="startBtn" class="btn btn-success">
                    Start
                </button>

                <button id="stopBtn" class="btn btn-danger" disabled>
                    Stop
                </button>

                <button id="resumeBtn" class="btn btn-primary" disabled>
                    Resume
                </button>

                <button id="resetBtn" class="btn btn-secondary" disabled>
                    Reset
                </button>
            </div>

        </div>
    </div>

    <!-- Custom JavaScript -->
    <script src="script.js"></script>
</body>
</html>
