<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple LMS</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-primary">
        <div class="container">
            <a class="navbar-brand" href="#">task one</a>
            <button id="logoutBtn" class="btn btn-light btn-sm d-none">Logout</button>
        </div>
    </nav>

    <main class="container py-4">
        <section id="authSection" class="row justify-content-center">
            <div class="col-md-6 col-lg-5">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h3 class="mb-3">Welcome</h3>
                        <div class="btn w-100 mb-3">
                            <button class="btn btn-outline-primary active" id="showLoginBtn">Sign In</button>
                            <button class="btn btn-outline-primary" id="showSignupBtn">Sign Up</button>
                        </div>

                        <form id="loginForm">
                            <div class="mb-3">
                                <label for="loginEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="loginEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="loginPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="loginPassword" required>
                            </div>
                            <button class="btn btn-primary w-100">Sign In</button>
                        </form>

                        <form id="signupForm" class="d-none">
                            <div class="mb-3">
                                <label for="signupName" class="form-label">Full Name</label>
                                <input type="text" class="form-control" id="signupName" required>
                            </div>
                            <div class="mb-3">
                                <label for="signupEmail" class="form-label">Email</label>
                                <input type="email" class="form-control" id="signupEmail" required>
                            </div>
                            <div class="mb-3">
                                <label for="signupPassword" class="form-label">Password</label>
                                <input type="password" class="form-control" id="signupPassword" minlength="4" required>
                            </div>
                            <div class="mb-3">
                                <label for="signupRole" class="form-label">Sign up as</label>
                                <select class="form-select" id="signupRole">
                                    <option value="student">Student</option>
                                    <option value="admin">Admin</option>
                                </select>
                            </div>
                            <button class="btn btn-primary w-100">Create Account</button>
                        </form>
                        <p id="authMessage" class="mt-3 mb-0 small"></p>
                    </div>
                </div>
                <p class="text-muted small mt-3">Beginner demo: information is saved in this browser only.</p>
            </div>
        </section>

        <section id="dashboardSection" class="d-none">
            <div class="d-flex justify-content-between align-items-center flex-wrap gap-2 mb-4">
                <div>
                    <h2 id="welcomeText" class="mb-1">Dashboard</h2>
                    <span id="roleText" class="badge text-bg-secondary"></span>
                </div>
            </div>

            <div id="adminPanel" class="d-none">
                <div class="card mb-4">
                    <div class="card-body">
                        <h4>Add a Course</h4>
                        <form id="courseForm" class="row g-2">
                            <div class="col-md-4">
                                <input id="courseTitle" class="form-control" placeholder="Course title" required>
                            </div>
                            <div class="col-md-6">
                                <input id="courseDescription" class="form-control" placeholder="Short description" required>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-success w-100">Add Course</button>
                            </div>
                        </form>
                    </div>
                </div>

                <div class="card mb-4">
                    <div class="card-body">
                        <h4>Assign a Course</h4>
                        <form id="assignForm" class="row g-2">
                            <div class="col-md-5">
                                <select id="studentSelect" class="form-select" required>
                                    <option value="">Choose student</option>
                                </select>
                            </div>
                            <div class="col-md-5">
                                <select id="assignCourseSelect" class="form-select" required>
                                    <option value="">Choose course</option>
                                </select>
                            </div>
                            <div class="col-md-2">
                                <button class="btn btn-primary w-100">Assign</button>
                            </div>
                        </form>
                        <p id="assignMessage" class="small mt-2 mb-0"></p>
                    </div>
                </div>
            </div>

            <h4 id="courseHeading" class="mb-3">My Courses</h4>
            <div id="courseList" class="row g-3"></div>

            <div id="adminUsersPanel" class="mt-4 d-none">
                <h4>Students and Assigned Courses</h4>
                <div id="studentAssignments" class="table-responsive"></div>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
