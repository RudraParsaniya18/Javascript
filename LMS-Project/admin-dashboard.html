
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Admin Dashboard - LMS</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>

<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#">LMS Portal</a>

            <button class="btn btn-outline-light btn-sm" onclick="logout()">
                Logout
            </button>
        </div>
    </nav>

    <!-- Dashboard -->
    <div class="container mt-4">

        <!-- Welcome Section -->
        <div class="mb-4">
            <h2 class="fw-bold">Admin Dashboard</h2>
            <h5 id="welcomeMessage" class="text-secondary"></h5>
        </div>

        <!-- Add Course -->
        <div class="card shadow-sm mb-4">
            <div class="card-header bg-primary text-white">
                <h5 class="mb-0">Add New Course</h5>
            </div>

            <div class="card-body">

                <form id="courseForm">

                    <div class="mb-3">
                        <label class="form-label">Course Name</label>
                        <input type="text" id="courseName" class="form-control"
                            placeholder="Enter course name" required>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Course Description</label>
                        <textarea id="courseDescription" class="form-control"
                            rows="3" placeholder="Enter course description" required></textarea>
                    </div>

                    <button type="submit" class="btn btn-primary">
                        Add Course
                    </button>

                </form>

            </div>
        </div>

        <!-- All Courses -->
        <div class="card shadow-sm mb-4">

            <div class="card-header bg-white">
                <h5 class="mb-0">All Courses</h5>
            </div>

            <div class="card-body">
                <div id="courseList" class="row"></div>
            </div>

        </div>

        <!-- Assign Course -->
        <div class="card shadow-sm mb-4">

            <div class="card-header bg-success text-white">
                <h5 class="mb-0">Assign Course to Student</h5>
            </div>

            <div class="card-body">

                <form id="assignForm">

                    <div class="mb-3">
                        <label class="form-label">Select Student</label>

                        <select id="studentSelect" class="form-select" required>
                            <option value="">Select Student</option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Select Course</label>

                        <select id="courseSelect" class="form-select" required>
                            <option value="">Select Course</option>
                        </select>
                    </div>

                    <button type="submit" class="btn btn-success">
                        Assign Course
                    </button>

                </form>

            </div>
        </div>

    </div>

    <!-- JavaScript -->
    <script src="js/storage.js"></script>
    <script src="js/admin.js"></script>

</body>
</html>
