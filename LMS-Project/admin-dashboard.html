<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="container mt-5">
        <h2>Admin Dashboard</h2>
        <h4 id="welcomeMessage"></h4>

        <hr>

        <h3>Add New Course</h3>

        <form id="courseForm">

            <div class="mb-3">
                <label class="form-label">Course Name</label>
                <input type="text" class="form-control" id="courseName" required>
            </div>

            <div class="mb-3">
                <label class="form-label">Course Description</label>
                <textarea class="form-control" id="courseDescription" required></textarea>
            </div>

            <button type="submit" class="btn btn-primary">
                Add Course
            </button>

        </form>

        <hr>

        <h3>All Courses</h3>

        <div id="courseList" class="row mt-3"></div>

        <hr>

        <h3>Assign Course to Student</h3>

        <form id="assignForm">

            <div class="mb-3">
                <label class="form-label">Select Student</label>
                <select id="studentSelect" class="form-select" required>
                    <option value="">Select Student</option>
                </select>
            </div>

            <div class="mb-3">
                <label class="form-label">Select Course</label>
                <select id="courseSelect" class="form-select" required>
                    <option value="">Select Course</option>
                </select>
            </div>

            <button type="submit" class="btn btn-primary">
                Assign Course
            </button>

        </form>
        <button class="btn btn-danger mt-3" onclick="logout()">Logout</button>
    </div>

    <script src="js/admin.js"></script>
</body>

</html>
