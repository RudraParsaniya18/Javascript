
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Name Filter</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        body {
            background-color: #f5f5f5;
        }

        .highlight {
            background-color: yellow;
            font-weight: bold;
        }

        #results {
            max-width: 500px;
        }

        .name-item {
            background-color: white;
            padding: 10px;
            border: 1px solid #ddd;
        }
    </style>
</head>
<body>

    <div class="container mt-5">
        <h2 class="mb-3">Name Filter</h2>

        <input
            type="text"
            id="searchBox"
            class="form-control"
            placeholder="Search names..."
        >

        <div id="results" class="mt-3"></div>
    </div>

    <script>
        // Static names
        let names = [
            "Rahul Sharma",
            "Amit Patel",
            "Soham Mehta",
            "Raj Verma",
            "Rohit Singh",
            "Priya Shah",
            "Neha Joshi",
            "Karan Malhotra",
            "Anjali Desai",
            "Vikram Rao",
            "Sneha Gupta",
            "Arjun Kapoor",
            "Pooja Mishra",
            "Nikhil Jain",
            "Riya Trivedi",
            "Manish Kumar",
            "Aarav Shah",
            "Ishita Patel",
            "Dev Mehta",
            "Kavya Singh",
            "Harsh Pandya",
            "Meera Joshi",
            "Yash Thakkar",
            "Diya Shah",
            "Varun Desai"
        ];

        let searchBox = document.getElementById("searchBox");
        let results = document.getElementById("results");

        // Filter names while typing
        searchBox.addEventListener("input", function() {

            let searchText = searchBox.value.trim();

            // Count only non-space characters
            let characterCount = searchText.replace(/\s/g, "").length;

            results.innerHTML = "";

            // Minimum 2 non-space characters
            if (characterCount < 2) {
                return;
            }

            // Split search into individual words
            let searchWords = searchText.split(/\s+/);

            // Find matching names
            let filteredNames = names.filter(function(name) {

                return searchWords.every(function(word) {
                    return name.toLowerCase().includes(word.toLowerCase());
                });

            });

            // Display results
            if (filteredNames.length === 0) {
                results.innerHTML = "<p>No names found.</p>";
                return;
            }

            filteredNames.forEach(function(name) {

                let highlightedName = name;

                searchWords.forEach(function(word) {

                    let regex = new RegExp(
                        "(" + word.replace(/[.*+?^${}()|[\]\\]/g, "\\$&") + ")",
                        "gi"
                    );

                    highlightedName = highlightedName.replace(
                        regex,
                        '<span class="highlight">$1</span>'
                    );

                });

                results.innerHTML += `
                    <div class="name-item">
                        ${highlightedName}
                    </div>
                `;

            });

        });
    </script>

</body>
</html>
